services:
  - type: web
    name: iot-copilot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LAM_SERVER_URL
        sync: false  # set manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.12"
